name: Tests

on:
    pull_request: null
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-go@v5
                with:
                    go-version: "1.26.6"

            # the end-to-end tests run the fixtures against every PHPUnit version
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    extensions: pcntl
                    coverage: none

            -   run: for v in 9 10 11 12 13; do composer install --working-dir=fixtures/phpunit-$v --no-interaction --no-progress; done

            -   run: go build ./...

            -   run: go vet ./...

            -   run: go test ./...

    format:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-go@v5
                with:
                    go-version: "1.26.6"

            -   name: Check gofmt -s
                run: |
                    unformatted=$(gofmt -l -s .)
                    if [ -n "$unformatted" ]; then
                        echo "These files need 'gofmt -s -w':"
                        echo "$unformatted"
                        exit 1
                    fi

            -   name: Check go fix ./...
                if: ${{ !cancelled() }}
                run: |
                    changed=$(go fix -diff ./... 2>/dev/null)
                    if [ -n "$changed" ]; then
                        echo "These files need 'go fix ./...':"
                        echo "$changed"
                        exit 1
                    fi

    analysis:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-go@v5
                with:
                    go-version: "1.26.6"

            -   name: gopls modernize
                run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest ./...

            -   uses: actions/cache@v4
                if: ${{ !cancelled() }}
                with:
                    path: ~/go/bin/deadcode
                    key: deadcode-v0.48.0

            -   name: install deadcode
                if: ${{ !cancelled() }}
                run: test -x ~/go/bin/deadcode || go install golang.org/x/tools/cmd/deadcode@v0.48.0

            # -test treats test funcs as roots
            -   name: deadcode
                if: ${{ !cancelled() }}
                run: |
                    found=$(deadcode -test ./...)
                    if [ -n "$found" ]; then
                        echo "Unreachable functions found:"
                        echo "$found"
                        exit 1
                    fi

            -   uses: golangci/golangci-lint-action@v8
                if: ${{ !cancelled() }}
                with:
                    version: v2.12.2

    security:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-go@v5
                with:
                    go-version: "1.26.6"

            -   uses: actions/cache@v4
                with:
                    path: ~/go/bin/govulncheck
                    key: govulncheck-v1.6.0

            -   name: install govulncheck
                run: test -x ~/go/bin/govulncheck || go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

            -   name: govulncheck
                run: govulncheck ./...
