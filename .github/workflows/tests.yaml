name: Tests

on:
    pull_request: null
    push:
        branches:
            - main

jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-go@v5
                with:
                    go-version-file: go.mod

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    extensions: pcntl
                    coverage: none

            -   run: for v in 9 10 11 12 13; do composer install --working-dir=fixtures/phpunit-$v --no-interaction --no-progress; done

            -   run: test -z "$(gofmt -l .)"

            -   run: go vet ./...

            -   run: go test ./...
