name: Projects

# runs test suites of real projects with plain PHPUnit, blink and blink-rs, compares results and speed

on:
    pull_request: null
    push:
        branches:
            - main

jobs:
    project:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    # integration tests share caches and files, so they are not safe to run in parallel
                    -   name: Laravel unit tests
                        repository: laravel/framework
                        ref: v13.33.0
                        config: phpunit-unit.xml

                    -   name: Rector
                        repository: rectorphp/rector-src
                        ref: 29e434b2065ae4a78a6b1eca4295620a5f6a2a5a
                        config: phpunit.xml

        name: ${{ matrix.name }}

        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-go@v5
                with:
                    go-version: "1.26.6"

            -   run: go build -o blink .

            -   uses: dtolnay/rust-toolchain@stable

            -   run: cargo build --release --manifest-path rust/Cargo.toml && cp rust/target/release/blink-rs .

            # same extensions as Laravel's own CI
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, redis, igbinary, msgpack, memcached, gmp
                    ini-values: memory_limit=2G
                    coverage: none

            -   uses: actions/checkout@v4
                with:
                    repository: ${{ matrix.repository }}
                    ref: ${{ matrix.ref }}
                    path: project

            -   run: composer install --working-dir=project --no-interaction --no-progress --prefer-dist

            -   name: Create Laravel unit test config
                if: matrix.repository == 'laravel/framework'
                working-directory: project
                run: sed 's|<directory suffix="Test.php">./tests</directory>|&<exclude>./tests/Integration</exclude>|' phpunit.xml.dist > phpunit-unit.xml

            -   name: Run PHPUnit
                working-directory: project
                run: |
                    start=$(date +%s.%N)
                    vendor/bin/phpunit -c ${{ matrix.config }} --no-progress --log-junit ../phpunit.xml || true
                    echo "PHPUNIT_TIME=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_ENV"

            -   name: Run blink
                working-directory: project
                run: |
                    start=$(date +%s.%N)
                    ../blink -c ${{ matrix.config }} | tee ../blink.out || true
                    echo "BLINK_TIME=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_ENV"

            # without timings of the Go run, so both start from the same state
            -   name: Run blink-rs
                working-directory: project
                run: |
                    rm -f .blink-timings.json
                    start=$(date +%s.%N)
                    ../blink-rs -c ${{ matrix.config }} | tee ../blink-rs.out || true
                    echo "BLINK_RS_TIME=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_ENV"

            -   name: Compare
                run: |
                    phpunit_tests=$(php -r '$s = simplexml_load_file("phpunit.xml")->testsuite; echo $s["tests"];')
                    phpunit_failed=$(php -r '$s = simplexml_load_file("phpunit.xml")->testsuite; echo $s["failures"] + $s["errors"];')
                    phpunit_skipped=$(php -r '$s = simplexml_load_file("phpunit.xml")->testsuite; echo $s["skipped"];')

                    speedup=$(echo "scale=1; $PHPUNIT_TIME / $BLINK_TIME" | bc)
                    speedup_rs=$(echo "scale=1; $PHPUNIT_TIME / $BLINK_RS_TIME" | bc)

                    {
                        echo "## ${{ matrix.name }}, ${{ matrix.repository }}@${{ matrix.ref }}, $(nproc) CPUs"
                        echo
                        echo "| Runner | Time | Tests | Failed | Skipped |"
                        echo "| --- | ---: | ---: | ---: | ---: |"
                        printf "| PHPUnit | %.1fs | %s | %s | %s |\n" "$PHPUNIT_TIME" "$phpunit_tests" "$phpunit_failed" "$phpunit_skipped"
                    } | tee -a "$GITHUB_STEP_SUMMARY"

                    status=0
                    for runner in blink blink-rs; do
                        summary=$(grep '^Tests: ' $runner.out)
                        tests=$(echo "$summary" | sed -E 's/^Tests: ([0-9]+),.*/\1/')
                        failed=$(echo "$summary" | sed -E 's/.*Failed: ([0-9]+),.*/\1/')
                        skipped=$(echo "$summary" | sed -E 's/.*Skipped: ([0-9]+),.*/\1/')
                        time=$BLINK_TIME
                        [ "$runner" = blink-rs ] && time=$BLINK_RS_TIME

                        printf "| %s | %.1fs | %s | %s | %s |\n" "$runner" "$time" "$tests" "$failed" "$skipped" | tee -a "$GITHUB_STEP_SUMMARY"

                        if [ "$phpunit_tests" != "$tests" ] || [ "$phpunit_skipped" != "$skipped" ]; then
                            echo "::error::$runner ran a different set of tests than PHPUnit"
                            status=1
                        fi
                    done

                    {
                        echo
                        echo "blink is **${speedup}x** faster, blink-rs is **${speedup_rs}x** faster"
                    } | tee -a "$GITHUB_STEP_SUMMARY"

                    exit $status
